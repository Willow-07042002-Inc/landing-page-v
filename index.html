<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Google Analytics and Microsoft Clarity load only after the visitor accepts
         analytics cookies: see src/lib/consent.ts. Nothing third-party loads here. -->

    <!-- iOS Status Bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F8FAFC" />

    <!-- Manifest (disabled in dev to prevent caching issues) -->
    <script>if(location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){var m=document.createElement('link');m.rel='manifest';m.href='/manifest.json';document.head.appendChild(m);}</script>
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Prevent caching in dev -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Estate Planning Platform for Attorneys" />
    <meta property="og:description" content="Modernize your practice with the all-in-one platform purpose-built for estate planning attorneys and the clients they serve." />
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Willow" />
    <meta property="og:image" content="https://www.willow-inc.com/og-card-v4.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@willow" />
    <meta name="twitter:title" content="The Estate Planning Platform for Attorneys" />
    <meta name="twitter:description" content="Modernize your practice with the all-in-one platform purpose-built for estate planning attorneys and the clients they serve." />
    <meta name="twitter:image" content="https://www.willow-inc.com/og-card-v4.jpg" />
    
    <!-- Fonts are self-hosted (public/fonts, declared in src/index.css). -->
