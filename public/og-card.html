<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; }
  .card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,69,68,0.42) 0%, rgba(6,69,68,0.60) 62%, rgba(6,69,68,0.78) 100%); }
  .logo { position: absolute; top: 44px; left: 64px; height: 92px; filter: brightness(0) invert(1); }
  .line { position: absolute; left: 64px; bottom: 64px; right: 64px; color: #fff; font-family: 'Merriweather', Georgia, serif; font-weight: 400; font-size: 56px; line-height: 1.22; letter-spacing: 0.005em; text-shadow: 0 2px 18px rgba(6,69,68,0.35); }
</style>
</head>
<body>
  <div class="card">
    <img class="bg" src="/golden-gate.jpg" />
    <div class="veil"></div>
    <img class="logo" src="/lovable-uploads/0f8b3b1d-f883-4294-a922-15b61c180de1.png" />
    <div class="line">Purpose built for trust<br />and estate attorneys.</div>
  </div>
</body>
</html>
