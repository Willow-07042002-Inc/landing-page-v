<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; }
  .card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% 55%; transform: scale(1.18); transform-origin: 72% 55%; }
  .logo { position: absolute; bottom: 44px; right: 64px; height: 92px; filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(6,69,68,0.5)); }
  .line { position: absolute; left: 64px; bottom: 64px; right: 64px; color: #fff; font-family: 'Merriweather', Georgia, serif; font-weight: 400; font-size: 56px; line-height: 1.22; letter-spacing: 0.005em; text-shadow: 0 2px 10px rgba(6,69,68,0.55), 0 4px 30px rgba(6,69,68,0.45); }
</style>
</head>
<body>
  <div class="card">
    <img class="bg" src="/golden-gate.jpg" />
    <img class="logo" src="/lovable-uploads/0f8b3b1d-f883-4294-a922-15b61c180de1.png" />
    <div class="line">Build lifelong relationships<br />with your clients.</div>
  </div>
</body>
</html>
